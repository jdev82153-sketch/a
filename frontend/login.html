
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <title>Acessar plataforma | Agência Marks</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090909;color:#f5f5f5;font-family:Arial,sans-serif;padding:22px}
    .card{width:min(430px,100%);padding:32px;background:#111;border:1px solid #292929;border-radius:17px}
    .brand{font-size:22px;font-weight:800;letter-spacing:-.7px;text-decoration:none;color:white}
    .brand span{color:#ff6a00}
    .eyebrow{margin-top:36px;color:#ff8d45;font-size:11px;font-weight:bold;letter-spacing:2px}
    h1{font-size:34px;letter-spacing:-1.3px;margin:10px 0}
    p{color:#999;font-size:14px;line-height:1.7}
    label{display:block;margin:19px 0 8px;color:#ddd;font-size:13px}
    input{width:100%;padding:14px;border:1px solid #333;border-radius:9px;background:#090909;color:white;font:inherit;outline:none}
    input:focus{border-color:#ff6a00}
    button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:9px;background:#ff6a00;color:white;font-size:14px;font-weight:bold;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}
    .message{color:#ffad7a;font-size:13px;overflow-wrap:anywhere}
    .back{display:inline-block;margin-top:23px;color:#aaa;text-decoration:none;font-size:13px}
    .back:hover{color:#ff6a00}
  </style>
</head>
<body>
  <main class="card">
    <a class="brand" href="./index.html">AGÊNCIA <span>MARKS</span></a>
    <div class="eyebrow">ÁREA DO CLIENTE</div>
    <h1>Acesse sua plataforma.</h1>
    <p>Use o nome da sua empresa e a chave de acesso fornecida pelo administrador.</p>

    <form id="companyLoginForm">
      <label for="companyName">Nome da empresa</label>
      <input id="companyName" autocomplete="organization" required maxlength="100" placeholder="Nome cadastrado">

      <label for="companyKey">Chave de acesso</label>
      <input id="companyKey" autocomplete="off" required spellcheck="false" placeholder="Cole sua chave aqui">

      <button id="submitButton" type="submit">Entrar na plataforma</button>
      <p id="message" class="message" role="status"></p>
    </form>

    <a class="back" href="./index.html">← Voltar ao site</a>
  </main>

  <script>
    const API = "https://agencia-marks.onrender.com";

    document.getElementById("companyLoginForm").addEventListener("submit", async event => {
      event.preventDefault();

      const button = document.getElementById("submitButton");
      const message = document.getElementById("message");
      button.disabled = true;
      message.textContent = "Verificando seu acesso...";

      try {
        const response = await fetch(API + "/api/company/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: document.getElementById("companyName").value.trim(),
            key: document.getElementById("companyKey").value.trim()
          })
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.message || "Não foi possível entrar.");

        sessionStorage.setItem("marks_company_token", data.token);
        sessionStorage.setItem("marks_company_name", data.company.name);
        window.location.href = "./dashboard.html";
      } catch (error) {
        message.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
