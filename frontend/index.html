<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#090909">
    <meta name="description" content="Agência Marks — Plataforma inteligente de automações para empresas.">

    <title>Agência Marks | Automação Inteligente</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --background: #090909;
            --surface: #111111;
            --surface-light: #181818;
            --border: rgba(255, 255, 255, 0.09);
            --text: #f5f5f5;
            --muted: #929292;
            --orange: #ff6a00;
            --orange-light: #ff8733;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: var(--background);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            overflow-x: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font: inherit;
        }

        .background-glow {
            position: fixed;
            top: -220px;
            left: 50%;
            transform: translateX(-50%);
            width: 750px;
            height: 500px;
            background: rgba(255, 106, 0, 0.09);
            filter: blur(140px);
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
        }

        .container {
            width: min(1120px, calc(100% - 40px));
            margin: 0 auto;
        }

        /* NAVEGAÇÃO */

        header {
            position: relative;
            z-index: 10;
            border-bottom: 1px solid var(--border);
            background: rgba(9, 9, 9, 0.8);
            backdrop-filter: blur(16px);
        }

        .navbar {
            min-height: 82px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .brand img {
            width: 43px;
            height: 43px;
            object-fit: contain;
            border-radius: 10px;
        }

        .brand-name {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 19px;
            font-weight: 700;
            letter-spacing: -0.7px;
            white-space: nowrap;
        }

        .brand-name span {
            color: var(--orange);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .nav-link {
            font-size: 13px;
            color: #c5c5c5;
            transition: color 0.2s;
        }

        .nav-link:hover {
            color: var(--orange);
        }

        .button {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            border: 1px solid transparent;
            border-radius: 9px;
            padding: 13px 19px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s, border-color 0.2s;
        }

        .button:hover {
            transform: translateY(-2px);
        }

        .button-primary {
            background: var(--orange);
            color: #fff;
            box-shadow: 0 5px 25px rgba(255, 106, 0, 0.13);
        }

        .button-primary:hover {
            background: var(--orange-light);
        }

        .button-secondary {
            background: rgba(255, 255, 255, 0.035);
            border-color: var(--border);
            color: var(--text);
        }

        .button-secondary:hover {
            border-color: rgba(255, 106, 0, 0.5);
        }

        .arrow {
            font-size: 17px;
            line-height: 12px;
        }

        /* HERO */

        .hero {
            position: relative;
            padding: 112px 0 88px;
            text-align: center;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 9px 13px;
            border: 1px solid rgba(255, 106, 0, 0.22);
            border-radius: 100px;
            background: rgba(255, 106, 0, 0.06);
            color: #ffb17d;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
            margin-bottom: 29px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background: var(--orange);
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(255, 106, 0, 0.7);
        }

        h1 {
            max-width: 850px;
            margin: 0 auto;
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(42px, 7vw, 76px);
            line-height: 1.06;
            letter-spacing: -3.8px;
            font-weight: 700;
        }

        h1 span {
            color: var(--orange);
        }

        .hero-description {
            max-width: 590px;
            margin: 25px auto 0;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.9;
        }

        .hero-actions {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 13px;
            margin-top: 34px;
        }

        .hero-actions .button {
            min-height: 49px;
        }

        .hero-note {
            margin-top: 19px;
            font-size: 11px;
            color: #6f6f6f;
        }

        /* PRÉVIA DO SISTEMA */

        .preview-section {
            padding-bottom: 105px;
        }

        .preview-frame {
            position: relative;
            max-width: 900px;
            margin: 0 auto;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.11);
            border-radius: 17px;
            background: rgba(255, 255, 255, 0.025);
            box-shadow: 0 30px 100px rgba(0, 0, 0, 0.35);
        }

        .preview-window {
            overflow: hidden;
            min-height: 315px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #0e0e0e;
        }

        .window-bar {
            height: 45px;
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 0 16px;
            border-bottom: 1px solid var(--border);
            background: #121212;
        }

        .window-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #414141;
        }

        .window-label {
            margin-left: 10px;
            color: #747474;
            font-size: 10px;
        }

        .preview-content {
            display: grid;
            grid-template-columns: 190px 1fr;
            min-height: 270px;
        }

        .preview-sidebar {
            padding: 19px 12px;
            border-right: 1px solid var(--border);
            background: #0b0b0b;
        }

        .preview-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 29px;
            padding: 0 5px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 12px;
            font-weight: 700;
        }

        .preview-brand img {
            width: 26px;
            height: 26px;
            object-fit: contain;
            border-radius: 6px;
        }

        .preview-menu-item {
            padding: 10px 9px;
            margin-bottom: 5px;
            color: #858585;
            border-radius: 6px;
            font-size: 10px;
        }

        .preview-menu-item.active {
            color: #ff9a5b;
            background: rgba(255, 106, 0, 0.11);
        }

        .preview-main {
            padding: 25px;
        }

        .preview-overline {
            margin-bottom: 8px;
            color: var(--orange);
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1.7px;
            font-weight: 700;
        }

        .preview-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 23px;
            letter-spacing: -0.8px;
        }

        .preview-subtitle {
            margin-top: 8px;
            color: #777;
            font-size: 11px;
        }

        .preview-cards {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
            margin-top: 25px;
        }

        .preview-card {
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #131313;
        }

        .preview-card-label {
            color: #8c8c8c;
            font-size: 9px;
        }

        .preview-card-value {
            margin-top: 12px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 21px;
            font-weight: 700;
        }

        .preview-card-value.orange {
            color: var(--orange);
        }

        .preview-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-top: 14px;
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #131313;
        }

        .preview-bottom-title {
            font-size: 11px;
            font-weight: 600;
        }

        .preview-bottom-description {
            margin-top: 5px;
            color: #777;
            font-size: 9px;
        }

        .preview-tag {
            padding: 7px 9px;
            color: #ffab77;
            background: rgba(255, 106, 0, 0.1);
            border-radius: 5px;
            font-size: 9px;
            white-space: nowrap;
        }

        /* FUNCIONALIDADES */

        .features {
            padding: 75px 0 95px;
            border-top: 1px solid var(--border);
            background: linear-gradient(180deg, #0c0c0c, #090909);
        }

        .section-heading {
            text-align: center;
            margin-bottom: 42px;
        }

        .section-label {
            color: var(--orange);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h2 {
            margin-top: 14px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(29px, 4vw, 43px);
            letter-spacing: -1.6px;
        }

        .section-description {
            max-width: 510px;
            margin: 14px auto 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.8;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 17px;
        }

        .feature-card {
            padding: 27px 23px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.02);
            transition: transform 0.25s, border-color 0.25s;
        }

        .feature-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 106, 0, 0.4);
        }

        .feature-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 43px;
            height: 43px;
            margin-bottom: 23px;
            border: 1px solid rgba(255, 106, 0, 0.22);
            border-radius: 10px;
            background: rgba(255, 106, 0, 0.09);
            color: var(--orange);
            font-size: 20px;
        }

        .feature-card h3 {
            margin-bottom: 11px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 17px;
        }

        .feature-card p {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.9;
        }

        /* CTA */

        .final-cta {
            padding: 75px 0;
            text-align: center;
        }

        .cta-box {
            padding: 54px 25px;
            border: 1px solid rgba(255, 106, 0, 0.2);
            border-radius: 15px;
            background:
                radial-gradient(ellipse at top, rgba(255, 106, 0, 0.09), transparent 65%),
                #101010;
        }

        .cta-box h2 {
            max-width: 600px;
            margin: 0 auto;
        }

        .cta-box p {
            max-width: 480px;
            margin: 17px auto 25px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.8;
        }

        /* RODAPÉ */

        footer {
            border-top: 1px solid var(--border);
        }

        .footer-content {
            min-height: 85px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .footer-brand {
            display: flex;
            align-items: center;
            gap: 9px;
            color: #aaa;
            font-size: 12px;
        }

        .footer-brand img {
            width: 27px;
            height: 27px;
            object-fit: contain;
        }

        .footer-copy {
            color: #696969;
            font-size: 11px;
        }

        /* ANIMAÇÕES */

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero > * {
            animation: fadeUp 0.7s ease both;
        }

        .hero > *:nth-child(2) {
            animation-delay: 0.08s;
        }

        .hero > *:nth-child(3) {
            animation-delay: 0.16s;
        }

        .hero > *:nth-child(4) {
            animation-delay: 0.24s;
        }

        .hero > *:nth-child(5) {
            animation-delay: 0.32s;
        }

        /* RESPONSIVIDADE */

        @media (max-width: 760px) {
            .container {
                width: calc(100% - 32px);
            }

            .navbar {
                min-height: 72px;
            }

            .brand img {
                width: 37px;
                height: 37px;
            }

            .brand-name {
                font-size: 16px;
            }

            .nav-right {
                gap: 12px;
            }

            .nav-link {
                display: none;
            }

            .nav-right .button {
                padding: 11px 13px;
                font-size: 11px;
            }

            .hero {
                padding: 85px 0 65px;
            }

            h1 {
                font-size: clamp(39px, 10vw, 58px);
                letter-spacing: -2.5px;
            }

            .hero-description {
                max-width: 430px;
                font-size: 14px;
            }

            .preview-section {
                padding-bottom: 75px;
            }

            .preview-content {
                grid-template-columns: 125px 1fr;
            }

            .preview-sidebar {
                padding: 15px 8px;
            }

            .preview-brand {
                gap: 6px;
                font-size: 10px;
            }

            .preview-brand img {
                width: 22px;
                height: 22px;
            }

            .preview-menu-item {
                font-size: 9px;
                padding: 9px 6px;
            }

            .preview-main {
                padding: 18px 12px;
            }

            .preview-title {
                font-size: 18px;
            }

            .preview-cards {
                gap: 6px;
            }

            .preview-card {
                padding: 10px 7px;
            }

            .preview-card-label {
                font-size: 8px;
            }

            .preview-card-value {
                font-size: 17px;
            }

            .preview-bottom {
                padding: 11px 9px;
            }

            .preview-bottom-title {
                font-size: 9px;
            }

            .preview-tag {
                font-size: 8px;
            }

            .feature-grid {
                grid-template-columns: 1fr;
            }

            .feature-card {
                padding: 23px;
            }

            .features {
                padding: 65px 0;
            }

            .final-cta {
                padding: 55px 0;
            }

            .footer-content {
                min-height: 95px;
                flex-direction: column;
                justify-content: center;
                gap: 9px;
            }
        }

        @media (max-width: 390px) {
            .brand {
                gap: 7px;
            }

            .brand-name {
                font-size: 14px;
            }

            .brand img {
                width: 32px;
                height: 32px;
            }

            .nav-right .button {
                padding: 10px;
            }

            .hero-actions {
                flex-direction: column;
            }

            .hero-actions .button {
                width: 100%;
            }

            .preview-content {
                grid-template-columns: 105px 1fr;
            }

            .preview-cards {
                grid-template-columns: 1fr;
            }

            .preview-card-value {
                margin-top: 6px;
            }

            .preview-bottom {
                align-items: flex-start;
                flex-direction: column;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

            <nav class="nav-right" aria-label="Navegação principal">
